# Publishes the Docker image and a GitHub release when a version tag is pushed:
#   1. Set __version__ in sharedesk/__init__.py, e.g. "0.2.0", and merge it to main.
#   2. git tag v0.2.0 && git push origin v0.2.0
# Image: ghcr.io/preswifi/sharedesk:<version> and :latest (amd64 + arm64).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches sharedesk/__init__.py
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sharedesk/__init__.py)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ = \"$version\""
            exit 1
          fi

  tests:
    uses: ./.github/workflows/tests.yml

  image:
    needs: [check-version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sharedesk
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "ShareDesk $GITHUB_REF_NAME"
